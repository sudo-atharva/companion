<div class="main-menu">
  <app-top-bar>
    <left-text>{{ now | date: 'HH:mm' }}</left-text>
    <span class="main-menu__heading" i18n="@@companion-printer">Printer</span>
  </app-top-bar>
  <!-- Companion look: three cards with green icons -->
  <div class="main-menu__options">
    <div class="main-menu__card" routerLink="/files" matRipple>
      <fa-icon icon="folder-open" class="main-menu__icon"></fa-icon>
      <ng-container i18n="@@menu-files">files</ng-container>
    </div>
    <div class="main-menu__card" routerLink="/filament" matRipple>
      <fa-icon icon="compact-disc" class="main-menu__icon"></fa-icon>
      <ng-container i18n="@@menu-filament">filament</ng-container>
    </div>
    <div class="main-menu__card" routerLink="/control" matRipple>
      <fa-icon icon="up-down-left-right" class="main-menu__icon"></fa-icon>
      <ng-container i18n="@@menu-control">control</ng-container>
    </div>
  </div>
</div>

<app-settings-icon></app-settings-icon>
